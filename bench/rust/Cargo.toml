[package]
name = "ming"
version = "0.1.0"
edition = "2021"
description = "MING Interpreter Nurture Gauntlet — Scheme interpreter benchmark for evaluating coding agents"

[lib]
name = "ming"
path = "src/lib.rs"

[dependencies]
env_logger = "0.11"
log = "0.4"
thiserror = "2"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.test]
opt-level = 2
